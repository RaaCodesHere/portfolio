<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Cyber Base -->
  <rect width="32" height="32" rx="7" fill="#0B0F19" />
  <rect width="30" height="30" x="1" y="1" rx="6" stroke="url(#shieldGrad)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Outer Cyber Hexagon -->
  <polygon points="16,4 27,10 27,22 16,28 5,22 5,10" stroke="url(#shieldGrad)" stroke-width="1.5" fill="rgba(19, 27, 46, 0.85)" filter="url(#shieldGlow)" />

  <!-- Distinctive "R" Monogram Silhouette -->
  <path d="M11 9H17C18.6569 9 20 10.3431 20 12C20 13.6569 18.6569 15 17 15H13.5V23H11V9ZM13.5 11V13H17C17.5523 13 18 12.5523 18 12C18 11.4477 17.5523 11 17 11H13.5Z" fill="#FFFFFF" />
  <path d="M15.5 14.5L20.5 23H17.8L13.5 15.5H15.5Z" fill="url(#shieldGrad)" />

  <!-- Animated Glowing Cyber Beacon Node -->
  <circle cx="23" cy="8" r="2.5" fill="#06B6D4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="23" cy="8" r="1" fill="#FFFFFF" />
</svg>
